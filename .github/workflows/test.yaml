name: Terraform AWS EKS

on:
  push:

 

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-java-demo-eks
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      TF_VAR_cloudshell_principal_arn: ${{ vars.CLOUDSHELL_PRINCIPAL_ARN || 'arn:aws:iam::820242935759:role/GithubAWSconnection' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.ARN }}
          aws-region: us-east-1

      - name: Verify AWS Connection
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Create or Reuse State Bucket
        id: state_bucket
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: bash .github/scripts/ensure-state-bucket.sh

      - name: Terraform Init
        env:
          TF_STATE_BUCKET: ${{ steps.state_bucket.outputs.bucket }}
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve
